<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GC Office Room Reservations</title>
  <!-- EmailJS SDK — sends confirmation emails client-side -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Top nav ── */
    nav {
      background: #1e3a5f;
      color: #fff;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    nav .brand { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.03em; }
    nav .nav-links { display: flex; gap: 0.5rem; }
    nav button {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    nav button:hover, nav button.active { background: rgba(255,255,255,0.15); }

    /* ── Page sections (only one visible at a time) ── */
    .page { display: none; padding: 2rem; max-width: 960px; margin: 0 auto; }
    .page.active { display: block; }

    h2 { font-size: 1.5rem; margin-bottom: 1.25rem; color: #1e3a5f; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    /* ── Room grid ── */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .room-card {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.2rem;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      text-align: center;
    }
    .room-card:hover { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .room-card.selected { border-color: #1e3a5f; background: #eff6ff; }
    .room-card .room-icon { font-size: 2rem; margin-bottom: 0.4rem; }
    .room-card .room-name { font-weight: 600; font-size: 1rem; }
    .room-card .room-cap  { font-size: 0.8rem; color: #64748b; margin-top: 0.2rem; }

    /* ── Form styles ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-grid.single { grid-template-columns: 1fr; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.3rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.95rem;
      background: #fff;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-group { margin-bottom: 0; }

    /* ── Buttons ── */
    .btn {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; transform: scale(1.02); }
    .btn-primary { background: #1e3a5f; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-sm      { padding: 0.35rem 0.8rem; font-size: 0.82rem; }

    /* ── Calendar ── */
    #cal-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    #cal-month-label { font-size: 1.1rem; font-weight: 700; color: #1e3a5f; min-width: 160px; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-day-name {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      padding: 4px 0;
    }
    .cal-cell {
      min-height: 80px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.78rem;
      vertical-align: top;
    }
    .cal-cell.empty { background: transparent; border: none; }
    .cal-cell.today { border-color: #3b82f6; }
    .cal-cell .day-num { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }
    .cal-event {
      background: #1e3a5f;
      color: #fff;
      border-radius: 4px;
      padding: 2px 4px;
      margin-top: 2px;
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .cal-event:hover { background: #2d5282; }

    /* ── Reservation list ── */
    .res-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .res-item:last-child { border-bottom: none; }
    .res-info .res-title { font-weight: 600; font-size: 0.97rem; }
    .res-info .res-meta  { font-size: 0.82rem; color: #64748b; margin-top: 2px; }
    .res-actions { display: flex; gap: 0.5rem; align-items: center; }

    /* ── Admin panel ── */
    #admin-lock { text-align: center; padding: 3rem 1rem; }
    #admin-lock input { max-width: 260px; display: inline-block; }
    #admin-content { display: none; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1e293b;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 9999;
      max-width: 320px;
    }
    #toast.show { opacity: 1; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .modal h3 { margin-bottom: 1.25rem; color: #1e3a5f; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      nav .brand { font-size: 1rem; }
    }
  </style>
</head>
<body>

<!-- ── Navigation ── -->
<nav>
  <span class="brand">GC Office Room Reservations</span>
  <div class="nav-links">
    <button class="active" onclick="showPage('book')">Book a Room</button>
    <button onclick="showPage('calendar')">Calendar</button>
    <button onclick="showPage('my-reservations')">My Reservations</button>
    <button onclick="showPage('admin')">Admin</button>
  </div>
</nav>

<!-- ══════════════════════════════════════════
     PAGE 1: Book a Room
══════════════════════════════════════════ -->
<div id="page-book" class="page active">
  <h2>Book a Room</h2>

  <!-- Step 1: choose a room -->
  <div class="card">
    <label style="margin-bottom:0.75rem">Select a Room</label>
    <div class="room-grid" id="room-grid"></div>
  </div>

  <!-- Step 2: fill in reservation details -->
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label for="res-name">Your Name</label>
        <input type="text" id="res-name" placeholder="Jane Smith">
      </div>
      <div class="form-group">
        <label for="res-email">Email (for calendar invite)</label>
        <input type="email" id="res-email" placeholder="jane@company.com">
      </div>
      <div class="form-group">
        <label for="res-title">Meeting Title</label>
        <input type="text" id="res-title" placeholder="Team Standup" value="Room Reservation">
      </div>
      <div class="form-group">
        <label for="res-date">Date</label>
        <input type="date" id="res-date">
      </div>
      <div class="form-group">
        <label for="res-start">Start Time</label>
        <input type="time" id="res-start">
      </div>
      <div class="form-group">
        <label for="res-end">End Time</label>
        <input type="time" id="res-end">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="res-notes">Notes (optional)</label>
        <textarea id="res-notes" rows="2" placeholder="Any setup needs, attendees, etc."></textarea>
      </div>
    </div>
    <div style="margin-top:1.25rem; display:flex; gap:0.75rem; align-items:center;">
      <button class="btn btn-primary" onclick="submitReservation()">Reserve Room</button>
      <span id="book-error" style="color:#ef4444; font-size:0.85rem;"></span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PAGE 2: Calendar View
══════════════════════════════════════════ -->
<div id="page-calendar" class="page">
  <h2>Room Calendar</h2>
  <div class="card">
    <div id="cal-header">
      <button class="btn btn-primary btn-sm" onclick="changeMonth(-1)">&#8592; Prev</button>
      <span id="cal-month-label"></span>
      <button class="btn btn-primary btn-sm" onclick="changeMonth(1)">Next &#8594;</button>
      <select id="cal-room-filter" onchange="renderCalendar()" style="margin-left:auto;width:auto;padding:0.4rem 0.75rem;">
        <option value="">All Rooms</option>
      </select>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PAGE 3: My Reservations
══════════════════════════════════════════ -->
<div id="page-my-reservations" class="page">
  <h2>My Reservations</h2>
  <div class="card" style="padding:0">
    <div id="my-res-list"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PAGE 4: Admin Panel
══════════════════════════════════════════ -->
<div id="page-admin" class="page">
  <h2>Admin Panel</h2>

  <!-- Password gate — default PIN is "admin123" — change in JS below -->
  <div id="admin-lock">
    <div class="card" style="max-width:340px; margin:0 auto; text-align:left;">
      <label for="admin-pin">Admin PIN</label>
      <input type="password" id="admin-pin" placeholder="Enter PIN" style="margin-bottom:1rem">
      <button class="btn btn-primary" onclick="unlockAdmin()">Unlock</button>
      <p id="admin-error" style="color:#ef4444;font-size:0.82rem;margin-top:0.5rem;"></p>
    </div>
  </div>

  <!-- Admin content shown after unlock -->
  <div id="admin-content">
    <div class="card">
      <h3 style="margin-bottom:1rem;color:#1e3a5f;">Manage Rooms</h3>
      <div style="display:flex;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap;">
        <input type="text" id="new-room-name" placeholder="Room name" style="flex:1;min-width:140px;">
        <input type="number" id="new-room-cap" placeholder="Capacity" min="1" style="width:110px;">
        <input type="text" id="new-room-icon" placeholder="Emoji icon" style="width:90px;">
        <button class="btn btn-primary" onclick="addRoom()">Add Room</button>
      </div>
      <div id="admin-room-list"></div>
    </div>

    <div class="card" style="padding:0">
      <div style="padding:1.25rem 1.25rem 0.5rem;display:flex;justify-content:space-between;align-items:center;">
        <h3 style="color:#1e3a5f;">All Reservations</h3>
        <button class="btn btn-danger btn-sm" onclick="clearAllReservations()">Clear All</button>
      </div>
      <div id="admin-res-list"></div>
    </div>
  </div>
</div>

<!-- ── Edit Reservation Modal ── -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>Edit Reservation</h3>
    <input type="hidden" id="edit-id">
    <div class="form-grid" style="margin-bottom:0">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="edit-name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="edit-email">
      </div>
      <div class="form-group">
        <label>Meeting Title</label>
        <input type="text" id="edit-title">
      </div>
      <div class="form-group">
        <label>Room</label>
        <select id="edit-room"></select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="edit-date">
      </div>
      <div class="form-group">
        <label>Start Time</label>
        <input type="time" id="edit-start">
      </div>
      <div class="form-group">
        <label>End Time</label>
        <input type="time" id="edit-end">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Notes</label>
        <textarea id="edit-notes" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" style="background:#e2e8f0;color:#1e293b" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- ── Toast notification ── -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════
// CONFIGURATION
// ══════════════════════════════════════════

const ADMIN_PIN = 'admin123'; // Change this PIN before deploying

// EmailJS credentials
const EMAILJS_SERVICE_ID  = 'service_mrpjxip';
const EMAILJS_TEMPLATE_ID = 'template_duql6rc';
const EMAILJS_PUBLIC_KEY  = 'AF5ekO_zIrv2kcKKS';

// Initialize EmailJS — v4 requires an object, not a bare string
emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

// Default rooms — admin can add/remove rooms at runtime (stored in localStorage)
const DEFAULT_ROOMS = [
  { id: 'r1', name: 'Boardroom',      capacity: 12, icon: '🏛️' },
  { id: 'r2', name: 'Conference A',   capacity: 8,  icon: '📋' },
  { id: 'r3', name: 'Conference B',   capacity: 6,  icon: '📌' },
  { id: 'r4', name: 'Huddle Room',    capacity: 4,  icon: '💬' },
  { id: 'r5', name: 'Training Room',  capacity: 20, icon: '🎓' },
];

// ══════════════════════════════════════════
// STATE — all data lives in localStorage
// ══════════════════════════════════════════

function getRooms() {
  const stored = localStorage.getItem('gc_rooms');
  return stored ? JSON.parse(stored) : DEFAULT_ROOMS;
}

function saveRooms(rooms) {
  localStorage.setItem('gc_rooms', JSON.stringify(rooms));
}

function getReservations() {
  const stored = localStorage.getItem('gc_reservations');
  return stored ? JSON.parse(stored) : [];
}

function saveReservations(res) {
  localStorage.setItem('gc_reservations', JSON.stringify(res));
}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.currentTarget.classList.add('active');

  // Re-render on page switch so data is always current
  if (name === 'calendar')        { renderCalendar(); populateCalRoomFilter(); }
  if (name === 'my-reservations') renderMyReservations();
  if (name === 'admin')           { renderAdminRooms(); renderAdminReservations(); }
}

// ══════════════════════════════════════════
// ROOM GRID (booking page)
// ══════════════════════════════════════════

let selectedRoom = null;

function renderRoomGrid() {
  const grid = document.getElementById('room-grid');
  grid.innerHTML = '';
  getRooms().forEach(room => {
    const div = document.createElement('div');
    div.className = 'room-card' + (selectedRoom === room.id ? ' selected' : '');
    div.innerHTML = `
      <div class="room-icon">${room.icon}</div>
      <div class="room-name">${room.name}</div>
      <div class="room-cap">Capacity: ${room.capacity}</div>`;
    div.onclick = () => {
      selectedRoom = room.id;
      renderRoomGrid(); // re-render to update selected state
    };
    grid.appendChild(div);
  });
}

// ══════════════════════════════════════════
// BOOK A RESERVATION
// ══════════════════════════════════════════

function submitReservation() {
  const err = document.getElementById('book-error');
  err.textContent = '';

  const name  = document.getElementById('res-name').value.trim();
  const email = document.getElementById('res-email').value.trim();
  const title = document.getElementById('res-title').value.trim();
  const date  = document.getElementById('res-date').value;
  const start = document.getElementById('res-start').value;
  const end   = document.getElementById('res-end').value;
  const notes = document.getElementById('res-notes').value.trim();

  // Basic validation
  if (!selectedRoom) { err.textContent = 'Please select a room.'; return; }
  if (!name)  { err.textContent = 'Name is required.'; return; }
  if (!email) { err.textContent = 'Email is required.'; return; }
  if (!title) { err.textContent = 'Meeting title is required.'; return; }
  if (!date)  { err.textContent = 'Date is required.'; return; }
  if (!start || !end) { err.textContent = 'Start and end time are required.'; return; }
  if (start >= end)   { err.textContent = 'End time must be after start time.'; return; }

  // Conflict check: no overlapping reservations in the same room on the same day
  const existing = getReservations();
  const conflict = existing.find(r =>
    r.roomId === selectedRoom &&
    r.date   === date &&
    start < r.end &&
    end   > r.start
  );
  if (conflict) {
    err.textContent = `Room is already booked ${conflict.start}–${conflict.end} by ${conflict.name}.`;
    return;
  }

  // Save reservation
  const reservation = {
    id: Date.now().toString(),
    roomId: selectedRoom,
    name, email, title, date, start, end, notes,
    createdAt: new Date().toISOString()
  };
  existing.push(reservation);
  saveReservations(existing);

  sendConfirmationEmail(reservation);
  showToast('Room reserved! Confirmation email sent.');
  resetBookForm();
}

function resetBookForm() {
  ['res-name','res-email','res-title','res-date','res-start','res-end','res-notes']
    .forEach(id => document.getElementById(id).value = '');
  selectedRoom = null;
  renderRoomGrid();
}

// ══════════════════════════════════════════
// ICS CALENDAR INVITE GENERATOR
// Downloads a .ics file the user can open in any calendar app (Google, Outlook, Apple)
// ══════════════════════════════════════════

function downloadICS(res) {
  const room = getRooms().find(r => r.id === res.roomId);
  const roomName = room ? room.name : 'Office Room';

  // Format date+time as ICS timestamp: YYYYMMDDTHHmmss
  function toICSDate(date, time) {
    return date.replace(/-/g, '') + 'T' + time.replace(/:/g, '') + '00';
  }

  const uid   = `${res.id}@gc-office-reservations`;
  const dtStart = toICSDate(res.date, res.start);
  const dtEnd   = toICSDate(res.date, res.end);
  const now     = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//GC Office Room Reservations//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:REQUEST',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${now}`,
    `DTSTART:${dtStart}`,
    `DTEND:${dtEnd}`,
    `SUMMARY:${res.title} — ${roomName}`,
    `DESCRIPTION:Room: ${roomName}\\nBooked by: ${res.name}\\nNotes: ${res.notes || 'None'}`,
    `LOCATION:${roomName}`,
    `ORGANIZER;CN=${res.name}:MAILTO:${res.email}`,
    `ATTENDEE;CN=${res.name};ROLE=REQ-PARTICIPANT:MAILTO:${res.email}`,
    'STATUS:CONFIRMED',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  // Create a temporary download link and click it
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `reservation-${res.title.replace(/\s+/g,'-')}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ══════════════════════════════════════════
// EMAIL CONFIRMATION — sends via EmailJS
// Includes a Google Calendar link so recipients can add the event in one click
// ══════════════════════════════════════════

// Build a Google Calendar "Add to Calendar" URL from reservation data
function buildGoogleCalLink(res, roomName) {
  function toGCalDate(date, time) {
    return date.replace(/-/g, '') + 'T' + time.replace(/:/g, '') + '00';
  }
  const base   = 'https://calendar.google.com/calendar/render';
  const params = new URLSearchParams({
    action:   'TEMPLATE',
    text:     `${res.title} — ${roomName}`,
    dates:    `${toGCalDate(res.date, res.start)}/${toGCalDate(res.date, res.end)}`,
    details:  `Booked by: ${res.name}\nNotes: ${res.notes || 'None'}`,
    location: roomName,
  });
  return `${base}?${params.toString()}`;
}

function sendConfirmationEmail(res) {
  const room     = getRooms().find(r => r.id === res.roomId);
  const roomName = room ? room.name : 'Unknown Room';

  const templateParams = {
    to_name:  res.name,
    to_email: res.email,
    title:    res.title,
    room:     roomName,
    date:     formatDate(res.date),
    start:    res.start,
    end:      res.end,
    name:     res.name,
    notes:    res.notes || 'None',
    cal_link: buildGoogleCalLink(res, roomName), // "Add to Google Calendar" link
  };

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
    .then(response => {
      console.log('EmailJS success:', response.status, response.text);
      showToast('Confirmation email sent to ' + res.email);
    })
    .catch(err => {
      // Show the full error on screen so we can diagnose it
      const msg = err?.text || err?.message || JSON.stringify(err);
      console.error('EmailJS error:', err);
      showToast('Email error: ' + msg, 8000);
    });
}

// ══════════════════════════════════════════
// CALENDAR VIEW
// ══════════════════════════════════════════

let calYear, calMonth;

function initCalendar() {
  const now = new Date();
  calYear  = now.getFullYear();
  calMonth = now.getMonth(); // 0-indexed
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0;  calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

function populateCalRoomFilter() {
  const sel = document.getElementById('cal-room-filter');
  const cur = sel.value;
  // Keep first "All Rooms" option, then repopulate
  sel.innerHTML = '<option value="">All Rooms</option>';
  getRooms().forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id; opt.textContent = r.name;
    if (r.id === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function renderCalendar() {
  const label     = document.getElementById('cal-month-label');
  const grid      = document.getElementById('cal-grid');
  const roomFilter = document.getElementById('cal-room-filter').value;

  const monthNames = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
  label.textContent = `${monthNames[calMonth]} ${calYear}`;

  grid.innerHTML = '';

  // Day-of-week headers
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay  = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today     = new Date();

  // Empty cells before the 1st
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  const reservations = getReservations().filter(r =>
    !roomFilter || r.roomId === roomFilter
  );
  const rooms = getRooms();

  // One cell per day
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear() === calYear &&
                    today.getMonth()    === calMonth &&
                    today.getDate()     === d;

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday ? ' today' : '');

    const dayNum = document.createElement('div');
    dayNum.className = 'day-num';
    dayNum.textContent = d;
    cell.appendChild(dayNum);

    // Show reservations that fall on this day
    reservations
      .filter(r => r.date === dateStr)
      .sort((a, b) => a.start.localeCompare(b.start))
      .forEach(r => {
        const room  = rooms.find(rm => rm.id === r.roomId);
        const event = document.createElement('div');
        event.className = 'cal-event';
        event.title     = `${r.title}\n${r.name}\n${r.start}–${r.end}`;
        event.textContent = `${r.start} ${room ? room.name : ''} – ${r.title}`;
        event.onclick = () => openEditModal(r.id);
        cell.appendChild(event);
      });

    grid.appendChild(cell);
  }
}

// ══════════════════════════════════════════
// MY RESERVATIONS
// ══════════════════════════════════════════

function renderMyReservations() {
  const list  = document.getElementById('my-res-list');
  const rooms = getRooms();
  const all   = getReservations().sort((a, b) =>
    (a.date + a.start).localeCompare(b.date + b.start)
  );

  if (!all.length) {
    list.innerHTML = '<p style="padding:1.5rem;color:#64748b;">No reservations yet.</p>';
    return;
  }

  list.innerHTML = all.map(r => {
    const room = rooms.find(rm => rm.id === r.roomId);
    return `
      <div class="res-item">
        <div class="res-info">
          <div class="res-title">${r.title}</div>
          <div class="res-meta">${room ? room.name : 'Unknown Room'} &bull; ${formatDate(r.date)} &bull; ${r.start}–${r.end}</div>
          <div class="res-meta">Booked by ${r.name} (${r.email})</div>
          ${r.notes ? `<div class="res-meta">${r.notes}</div>` : ''}
        </div>
        <div class="res-actions">
          <button class="btn btn-primary btn-sm" onclick="openEditModal('${r.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="cancelReservation('${r.id}', 'my')">Cancel</button>
        </div>
      </div>`;
  }).join('');
}

// ══════════════════════════════════════════
// EDIT MODAL
// ══════════════════════════════════════════

function openEditModal(id) {
  const res  = getReservations().find(r => r.id === id);
  if (!res) return;

  // Populate room dropdown
  const roomSel = document.getElementById('edit-room');
  roomSel.innerHTML = getRooms().map(r =>
    `<option value="${r.id}" ${r.id === res.roomId ? 'selected' : ''}>${r.name}</option>`
  ).join('');

  // Fill fields
  document.getElementById('edit-id').value    = res.id;
  document.getElementById('edit-name').value  = res.name;
  document.getElementById('edit-email').value = res.email;
  document.getElementById('edit-title').value = res.title;
  document.getElementById('edit-date').value  = res.date;
  document.getElementById('edit-start').value = res.start;
  document.getElementById('edit-end').value   = res.end;
  document.getElementById('edit-notes').value = res.notes || '';

  document.getElementById('edit-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
}

function saveEdit() {
  const id    = document.getElementById('edit-id').value;
  const start = document.getElementById('edit-start').value;
  const end   = document.getElementById('edit-end').value;
  if (start >= end) { showToast('End time must be after start time.'); return; }

  const reservations = getReservations();
  const idx = reservations.findIndex(r => r.id === id);
  if (idx === -1) return;

  const updated = {
    ...reservations[idx],
    name:   document.getElementById('edit-name').value.trim(),
    email:  document.getElementById('edit-email').value.trim(),
    title:  document.getElementById('edit-title').value.trim(),
    roomId: document.getElementById('edit-room').value,
    date:   document.getElementById('edit-date').value,
    start, end,
    notes:  document.getElementById('edit-notes').value.trim(),
  };

  reservations[idx] = updated;
  saveReservations(reservations);

  closeModal();
  showToast('Reservation updated.');
  renderMyReservations();
  renderAdminReservations();

  sendConfirmationEmail(updated);
}

// ══════════════════════════════════════════
// CANCEL RESERVATION
// ══════════════════════════════════════════

function cancelReservation(id, source) {
  if (!confirm('Cancel this reservation?')) return;
  const reservations = getReservations().filter(r => r.id !== id);
  saveReservations(reservations);
  showToast('Reservation cancelled.');
  if (source === 'my')    renderMyReservations();
  if (source === 'admin') renderAdminReservations();
  renderCalendar();
}

// ══════════════════════════════════════════
// ADMIN PANEL
// ══════════════════════════════════════════

function unlockAdmin() {
  const pin = document.getElementById('admin-pin').value;
  if (pin === ADMIN_PIN) {
    document.getElementById('admin-lock').style.display    = 'none';
    document.getElementById('admin-content').style.display = 'block';
    renderAdminRooms();
    renderAdminReservations();
  } else {
    document.getElementById('admin-error').textContent = 'Incorrect PIN.';
  }
}

function renderAdminRooms() {
  const list  = document.getElementById('admin-room-list');
  const rooms = getRooms();
  if (!rooms.length) { list.innerHTML = '<p style="color:#64748b">No rooms configured.</p>'; return; }
  list.innerHTML = rooms.map(r => `
    <div style="display:flex;align-items:center;gap:1rem;padding:0.5rem 0;border-bottom:1px solid #f1f5f9;">
      <span style="font-size:1.4rem">${r.icon}</span>
      <span style="flex:1;font-weight:600">${r.name}</span>
      <span style="color:#64748b;font-size:0.85rem">Cap: ${r.capacity}</span>
      <button class="btn btn-danger btn-sm" onclick="deleteRoom('${r.id}')">Remove</button>
    </div>`).join('');
}

function addRoom() {
  const name = document.getElementById('new-room-name').value.trim();
  const cap  = parseInt(document.getElementById('new-room-cap').value) || 1;
  const icon = document.getElementById('new-room-icon').value.trim() || '🚪';
  if (!name) { showToast('Room name is required.'); return; }

  const rooms = getRooms();
  rooms.push({ id: 'r' + Date.now(), name, capacity: cap, icon });
  saveRooms(rooms);
  renderAdminRooms();
  renderRoomGrid();
  showToast(`Room "${name}" added.`);
  ['new-room-name','new-room-cap','new-room-icon'].forEach(id => document.getElementById(id).value = '');
}

function deleteRoom(id) {
  if (!confirm('Remove this room? Existing reservations for it will still exist.')) return;
  saveRooms(getRooms().filter(r => r.id !== id));
  renderAdminRooms();
  renderRoomGrid();
  showToast('Room removed.');
}

function renderAdminReservations() {
  const list  = document.getElementById('admin-res-list');
  if (!list) return;
  const rooms = getRooms();
  const all   = getReservations().sort((a, b) =>
    (a.date + a.start).localeCompare(b.date + b.start)
  );
  if (!all.length) {
    list.innerHTML = '<p style="padding:1.5rem;color:#64748b;">No reservations.</p>';
    return;
  }
  list.innerHTML = all.map(r => {
    const room = rooms.find(rm => rm.id === r.roomId);
    return `
      <div class="res-item">
        <div class="res-info">
          <div class="res-title">${r.title}</div>
          <div class="res-meta">${room ? room.name : 'Unknown Room'} &bull; ${formatDate(r.date)} &bull; ${r.start}–${r.end}</div>
          <div class="res-meta">Booked by ${r.name} (${r.email})</div>
        </div>
        <div class="res-actions">
          <button class="btn btn-danger btn-sm" onclick="cancelReservation('${r.id}', 'admin')">Cancel</button>
        </div>
      </div>`;
  }).join('');
}

function clearAllReservations() {
  if (!confirm('Delete ALL reservations? This cannot be undone.')) return;
  saveReservations([]);
  renderAdminReservations();
  renderCalendar();
  showToast('All reservations cleared.');
}

// ══════════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════════

// Format "2025-06-01" → "Sun, Jun 1, 2025"
function formatDate(dateStr) {
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', {
    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
  });
}

// Show a brief toast message at the bottom-right
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// Close the edit modal when clicking the dark overlay
document.getElementById('edit-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ══════════════════════════════════════════
// INIT — run on page load
// ══════════════════════════════════════════

initCalendar();
renderRoomGrid();

// Default today's date in the booking form
document.getElementById('res-date').value = new Date().toISOString().split('T')[0];
</script>
